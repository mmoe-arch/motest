<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f4" />
    <meta
      name="description"
      content="在一方宁静的棋盘上，开启一局数独。"
    />
    <title>数独时光 — 给思绪一点留白</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <a class="brand" href="./" aria-label="数独时光首页">
          <span class="brand-icon" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </span>
          <span>数独<span class="brand-light">时光</span></span>
        </a>
        <div class="topbar-note"><span class="status-dot"></span> 一场安静的思考</div>
      </header>

      <section class="game-layout" aria-label="数独游戏">
        <div class="game-main">
          <div class="intro">
            <p class="eyebrow">A LITTLE PAUSE FOR YOUR MIND</p>
            <h1>给思绪一点留白<span class="title-period">。</span></h1>
            <p class="subtitle">填满九宫格，不急，慢慢来。</p>
          </div>

          <div class="game-bar">
            <label class="difficulty-picker">
              <span class="sr-only">选择难度</span>
              <select id="difficulty" aria-label="选择难度">
                <option value="easy">初级</option>
                <option value="medium" selected>中级</option>
                <option value="hard">高级</option>
              </select>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg>
            </label>
            <button class="text-button" id="new-game" type="button">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 8A6.7 6.7 0 0 0 4.7 5.4L3 7m0 0V3.5M3 7h3.5M3.5 12A6.7 6.7 0 0 0 15.3 14.6L17 13m0 0v3.5M17 13h-3.5" /></svg>
              <span>新游戏</span>
            </button>
          </div>

          <div class="board-wrap">
            <div class="sudoku-board" id="board" role="grid" aria-label="数独棋盘"></div>
          </div>

          <div class="number-pad" id="number-pad" aria-label="数字键盘">
            <button type="button" data-number="1">1</button>
            <button type="button" data-number="2">2</button>
            <button type="button" data-number="3">3</button>
            <button type="button" data-number="4">4</button>
            <button type="button" data-number="5">5</button>
            <button type="button" data-number="6">6</button>
            <button type="button" data-number="7">7</button>
            <button type="button" data-number="8">8</button>
            <button type="button" data-number="9">9</button>
          </div>

          <div class="board-footer">
            <span><span class="legend-dot given"></span>题目数字</span>
            <span><span class="legend-dot selected-legend"></span>当前选中</span>
            <span><span class="legend-dot note-legend"></span>笔记</span>
          </div>
        </div>

        <aside class="side-panel" aria-label="游戏工具">
          <section class="stats-card">
            <div class="section-heading">
              <span>本局进度</span>
              <span class="live-indicator"><i></i> 进行中</span>
            </div>
            <div class="stats-grid">
              <div class="stat">
                <span class="stat-label">用时</span>
                <strong class="stat-value mono" id="timer">00:00</strong>
              </div>
              <div class="stat">
                <span class="stat-label">错误</span>
                <strong class="stat-value mono" id="mistakes">0<span class="stat-unit"> 次</span></strong>
              </div>
            </div>
            <div class="progress-heading">
              <span>完成度</span><span id="progress-label">0 / 81</span>
            </div>
            <div class="progress-track"><div id="progress-bar"></div></div>
          </section>

          <section class="tools-card">
            <h2>游戏工具</h2>
            <div class="tool-grid">
              <button class="tool-button" id="notes-toggle" type="button" aria-pressed="false">
                <span class="tool-icon">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5h10A1.5 1.5 0 0 1 16.5 5v10a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 15V5A1.5 1.5 0 0 1 5 3.5Zm2.5 3h5m-5 3h5m-5 3h2" /></svg>
                </span>
                <span>笔记</span>
                <kbd>N</kbd>
              </button>
              <button class="tool-button" id="erase" type="button">
                <span class="tool-icon">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 4 8 8-4.5 4.5H5L2.5 14 12 4.5A1.4 1.4 0 0 1 14 4.5L16 6.5M8 4l8 8" /></svg>
                </span>
                <span>擦除</span>
                <kbd>⌫</kbd>
              </button>
              <button class="tool-button" id="hint" type="button">
                <span class="tool-icon">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.8a5.2 5.2 0 0 0-3.3 9.2c.8.7 1.3 1.4 1.3 2.2h4c0-.8.5-1.5 1.3-2.2A5.2 5.2 0 0 0 10 2.8Zm-1.5 14h3m-2.5-2.6h2" /></svg>
                </span>
                <span>提示</span>
                <kbd>H</kbd>
              </button>
              <button class="tool-button" id="check" type="button">
                <span class="tool-icon">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10.5 4 4L16.5 6" /></svg>
                </span>
                <span>检查</span>
                <kbd>↵</kbd>
              </button>
            </div>
            <p class="tool-hint" id="tool-hint" aria-live="polite">选中格子后，输入数字开始游戏。</p>
          </section>

          <section class="tip-card">
            <div class="tip-icon" aria-hidden="true">✳</div>
            <div>
              <h2>小小提示</h2>
              <p>每一行、每一列和每个九宫格，都要包含 1 到 9，且不能重复。</p>
            </div>
          </section>

          <button class="restart-button" id="restart" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 8a6.5 6.5 0 0 0-11.5-2L3 8m0 0V4.5M3 8h3.5M4 12a6.5 6.5 0 0 0 11.5 2L17 12m0 0v3.5M17 12h-3.5" /></svg>
            重新开始本局
          </button>
        </aside>
      </section>

      <footer class="page-footer">
        <span>慢一点，也没关系。</span>
        <span>MADE FOR A QUIETER MOMENT <span class="footer-star">✳</span></span>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="win-modal" role="dialog" aria-modal="true" aria-labelledby="win-title" hidden>
      <div class="win-card">
        <div class="win-sparkle" aria-hidden="true">✳</div>
        <p class="eyebrow">BEAUTIFULLY DONE</p>
        <h2 id="win-title">这一局，完成了。</h2>
        <p class="win-copy">每一个数字，都恰到好处。</p>
        <div class="win-time"><span>本局用时</span><strong class="mono" id="win-time">00:00</strong></div>
        <button id="play-again" type="button">再来一局 <span aria-hidden="true">→</span></button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
